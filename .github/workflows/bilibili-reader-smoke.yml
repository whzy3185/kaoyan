name: Bilibili reader smoke test

on:
  push:
    branches:
      - tooling/bilibili-reader
    paths:
      - ".github/workflows/bilibili-reader-smoke.yml"
      - "tools/bilibili_reader/**"
  workflow_dispatch:
    inputs:
      source:
        description: "Bilibili URL or BVID"
        required: true
        default: "https://www.bilibili.com/video/BV1BcXQYUEiL/"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp fallback
        run: python -m pip install -U yt-dlp

      - name: Install official Bili23 Downloader portable
        run: |
          mkdir -p .tools/bili23
          curl -L --fail --retry 3             -o /tmp/bili23.tar.gz             https://github.com/ScottSloan/Bili23-Downloader/releases/download/v2.15.0/Bili23-Downloader_2.15.0_linux_amd64_portable.tar.gz
          echo "7590fd0954fda7da4d1e387c714066ef81076d058d9004538e40b033f059f859  /tmp/bili23.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bili23.tar.gz -C .tools/bili23
          echo "=== Bili23 portable contents ==="
          find .tools/bili23 -maxdepth 3 -type f -printf '%p\n' | head -n 100
          echo "=== executable candidates ==="
          find .tools/bili23 -maxdepth 4 -type f -perm -111 -printf '%p\n' | head -n 50

      - name: Install Bili23 Linux runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6

      - name: Bili23 MCP smoke test
        continue-on-error: true
        run: |
          BIN=".tools/bili23/Bili23-Downloader/bili23-downloader"
          echo "BIN=$BIN"
          test -n "$BIN" || exit 0

          # First boot creates the application configuration.
          timeout 4s env QT_QPA_PLATFORM=offscreen "$BIN" > /tmp/bili23-firstboot.log 2>&1 || true

          CONFIG="$HOME/.local/share/Bili23 Downloader/config.json"
          echo "CONFIG=$CONFIG"
          if [ ! -f "$CONFIG" ]; then
            echo "Bili23 config was not created"
            cat /tmp/bili23-firstboot.log || true
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path.home()/".local/share/Bili23 Downloader/config.json"
          d=json.loads(p.read_text(encoding="utf-8"))
          d.setdefault("MCP",{})
          d["MCP"]["mcp_enabled"]=True
          d["MCP"]["mcp_port"]=23330
          d["MCP"]["mcp_token"]="smoke-token"
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding="utf-8")
          print("MCP config:", d.get("MCP"))
          PY

          env QT_QPA_PLATFORM=offscreen "$BIN" > /tmp/bili23-mcp.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -s -o /dev/null -X POST               -H 'Authorization: Bearer smoke-token'               -H 'Content-Type: application/json'               --data '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}'               http://127.0.0.1:23330/mcp; then
              break
            fi
            sleep 0.5
          done

          echo "=== initialize ==="
          curl -sS -X POST             -H 'Authorization: Bearer smoke-token'             -H 'Content-Type: application/json'             --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'             http://127.0.0.1:23330/mcp | tee /tmp/bili23-initialize.json || true

          echo
          echo "=== tools/list ==="
          curl -sS -X POST             -H 'Authorization: Bearer smoke-token'             -H 'Content-Type: application/json'             --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'             http://127.0.0.1:23330/mcp | tee /tmp/bili23-tools.json || true

          echo
          echo "=== parse_url ==="
          curl -sS -X POST             -H 'Authorization: Bearer smoke-token'             -H 'Content-Type: application/json'             --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"parse_url","arguments":{"url":"https://www.bilibili.com/video/BV1BcXQYUEiL/","limit":20}}}'             http://127.0.0.1:23330/mcp | tee /tmp/bili23-parse.json || true

          echo
          echo "=== create_download P1: audio 64K + AI subtitle txt ==="
          mkdir -p output
          curl -sS -X POST \
            -H 'Authorization: Bearer smoke-token' \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"create_download","arguments":{"episode_ids":["1"],"options":{"media":"audio","audio_quality":"64K","subtitle":true,"subtitle_format":"txt","subtitle_languages":["ai-zh"]},"redownload":true}}}' \
            http://127.0.0.1:23330/mcp | tee /tmp/bili23-create.json || true

          TASK_ID="$(python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/bili23-create.json',encoding='utf-8'))
              print(d['result']['structuredContent']['tasks'][0]['task_id'])
          except Exception:
              print('')
          PY
          )"
          echo "TASK_ID=$TASK_ID"

          if [ -n "$TASK_ID" ]; then
            for i in $(seq 1 60); do
              curl -sS -X POST \
                -H 'Authorization: Bearer smoke-token' \
                -H 'Content-Type: application/json' \
                --data "{\"jsonrpc\":\"2.0\",\"id\":5,\"method\":\"tools/call\",\"params\":{\"name\":\"get_task_status\",\"arguments\":{\"task_id\":\"$TASK_ID\"}}}" \
                http://127.0.0.1:23330/mcp > /tmp/bili23-status.json || true
              STATUS="$(python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/bili23-status.json',encoding='utf-8'))
              print(d['result']['structuredContent'].get('status',''))
          except Exception:
              print('')
          PY
              )"
              PROGRESS="$(python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/bili23-status.json',encoding='utf-8'))
              print(d['result']['structuredContent'].get('progress',''))
          except Exception:
              print('')
          PY
              )"
              echo "poll $i: status=$STATUS progress=$PROGRESS"
              if [ "$STATUS" = "completed" ] || [ "$STATUS" = "error" ] || [ "$STATUS" = "failed" ]; then
                break
              fi
              sleep 2
            done
            echo "=== final task status ==="
            cat /tmp/bili23-status.json || true
          fi

          echo "=== downloaded subtitle candidates ==="
          find "$HOME/Downloads" -type f -name '*.txt' -print 2>/dev/null || true
          find "$HOME/Downloads" -type f -name '*.txt' -exec cp {} output/ \; 2>/dev/null || true

          echo
          echo "=== Bili23 MCP log ==="
          tail -n 160 /tmp/bili23-mcp.log || true
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          trap - EXIT

      - name: Fetch subtitles
        continue-on-error: true
        run: |
          SOURCE="${{ github.event.inputs.source || 'https://www.bilibili.com/video/BV1BcXQYUEiL/' }}"
          python tools/bilibili_reader/fetch_subtitles.py "$SOURCE" --out output

      - name: Show diagnostics
        if: always()
        run: |
          find output -maxdepth 2 -type f -printf '%p %s bytes\n' || true
          test -f output/errors.txt && cat output/errors.txt || true
          test -f output/yt-dlp.log && tail -n 120 output/yt-dlp.log || true
          test -f output/metadata.json && cat output/metadata.json || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-reader-output
          path: output/
          if-no-files-found: warn
